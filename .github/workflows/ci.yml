name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # macos-26 carries Xcode 26, the first SDK that draws the macOS 26 window style the app requires (see AGENTS.md).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Show toolchain
        # The image's default Xcode is the newest 26.x; the bundle needs at least the macOS 26 SDK for actool's Icon Composer support.
        run: |
          xcodebuild -version
          swift --version
      - name: Debug build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Release build
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Tests
        run: swift test
